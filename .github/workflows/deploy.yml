name: Deploy to CloudHub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Verify secrets are present
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "ERROR: ANYPOINT_CLIENT_ID secret is empty or missing"
            exit 1
          fi
          if [ -z "$CLIENT_SECRET" ]; then
            echo "ERROR: ANYPOINT_CLIENT_SECRET secret is empty or missing"
            exit 1
          fi
          echo "Secrets are configured"
        env:
          CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      - name: Build and Deploy to CloudHub
        env:
          CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn clean deploy -DmuleDeploy -e \
            -Danypoint.clientId="$CLIENT_ID" \
            -Danypoint.clientSecret="$CLIENT_SECRET"
