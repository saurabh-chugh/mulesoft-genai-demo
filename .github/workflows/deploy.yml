name: Deploy to CloudHub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Configure Maven settings
        env:
          CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          BETTERSTACK_TOKEN: ${{ secrets.BETTERSTACK_TOKEN }}
          BETTERSTACK_INGEST_URL: ${{ secrets.BETTERSTACK_INGEST_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>exchange-repo</id>
                <username>~~~Client~~~</username>
                <password>${CLIENT_ID}~?~${CLIENT_SECRET}</password>
              </server>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${CLIENT_ID}~?~${CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish to Exchange
        run: mvn clean deploy -DskipMuleDeploy=true -Drevision=1.0.${{ github.run_number }} -B

      - name: Deploy to CloudHub 2.0
        env:
          CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn deploy -DmuleDeploy -Drevision=1.0.${{ github.run_number }} -B \
            -Danypoint.clientId="$CLIENT_ID" \
            -Danypoint.clientSecret="$CLIENT_SECRET"
